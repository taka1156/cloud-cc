<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cloud-cc | AWS構成ゲーム</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>cloud-cc <small>AWS構成ゲーム PoC</small></h1>
    <div class="toolbar">
      <select id="set-select" aria-label="問題セット"></select>
      <label class="btn">JSON取り込み<input id="import-file" type="file" accept=".json,application/json" hidden></label>
      <a class="btn" href="editor/index.html">作問エディター</a>
    </div>
    <p id="status" class="status"></p>
  </header>

  <main class="game">
    <div class="side">
      <section class="panel" id="problem"></section>
      <section class="panel">
        <div id="result"></div>
      </section>
    </div>

    <section class="panel">
      <div class="board-head">
        <h2>構成図</h2>
        <div class="toolbar">
          <span id="link-count" class="meta"></span>
          <button id="delete-link" type="button" disabled>選んだ線を削除</button>
          <button id="judge" class="primary" type="button">判定する</button>
          <button id="reset" type="button">リセット</button>
        </div>
      </div>
      <p class="meta">
        山札のカードを盤面にドラッグ（クリックでも追加）。カードの右の○を別のカードまでドラッグすると線がつながります。線は向きがないので、どちら向きに引いても同じです。線を選んで Delete で削除できます。
      </p>

      <div id="board" class="board">
        <p id="board-empty" class="board-empty">下の山札からカードをドラッグしてください</p>
      </div>

      <div id="tray" class="tray"></div>
    </section>
  </main>

  <script type="module" src="js/game.js"></script>
</body>
</html>
