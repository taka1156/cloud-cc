name: Publish dist branch

# main の内容を検証し、公開用の dist/ を dist ブランチへ上書きする。
# GitHub Pages は「Deploy from a branch: dist / (root)」で配信する。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dist-branch
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 問題データの検証（不正なJSONは公開しない）
      - name: Validate problem data
        run: node scripts/build.mjs --check

      - name: Build dist
        run: node scripts/dist.mjs

      # dist/ を単独のgitリポジトリとして作り直し、dist ブランチへ強制pushする
      - name: Push dist branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:dist
          echo "pushed dist branch for ${GITHUB_SHA::7}"
